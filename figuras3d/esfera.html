<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esfera - Calculadora Geométrica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="light-mode">
    <div class="contenedor">
        <div class="pantalla activa">
            <button class="boton boton-regresar" onclick="window.location.href='figuras3d.html'">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
            
            <div id="contenedor-esfera" style="position: relative; text-align: center;">
                <img src="../imagenes/esfera.png" alt="Esfera con radio" width="300">
                <div id="valor-radio" style="position: absolute; top: 120px; left: 300px; font-size: 16px; color: red;">
                    r = 
                </div>
            </div>
            
            <h2>🟠 Esfera</h2>

            <div class="grupo-entrada"> 
                <label><i class="fas fa-ruler"></i> Radio:</label> 
                <input 
                    id="entrada-radio-esfera" 
                    placeholder="Ingrese el radio" 
                    oninput="actualizarTextoRadio()"
                > 
            </div>

            <div class="grupo-botones">
                <button class="boton boton-primario" onclick="calcularEsfera('area')">
                    <i class="fas fa-calculator"></i> Calcular Área Superficial
                </button> 
                <button class="boton boton-primario" onclick="calcularEsfera('volumen')">
                    <i class="fas fa-ruler-combined"></i> Calcular Volumen
                </button> 
                <button class="boton boton-secundario" onclick="mostrarPasosEsfera()">
                    <i class="fas fa-search"></i> Ver Pasos de resolución
                </button>
                <button class="boton boton-peligro" onclick="limpiarEsfera()">
                    <i class="fas fa-trash"></i> Limpiar
                </button>
            </div>

            <div id="resultado-esfera" class="resultado">
                <i class="fas fa-info-circle"></i> Los resultados aparecerán aquí
            </div> 

            <div id="pasos-esfera" class="pasos-resolucion" style="display:none;"></div>
        </div>
    </div>

    <script src="esfera.js"></script>
    <script src="figuras3d.js"></script>
</body>
</html>
