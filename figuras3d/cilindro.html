<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cilindro - Calculadora Geométrica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="light-mode">
    <div class="contenedor">
        <div class="pantalla activa">
            <button class="boton boton-regresar" onclick="window.location.href='figuras3d.html'">
                <i class="fas fa-arrow-left"></i> Volver
            </button>

            <div id="visual-cilindro" style="position: relative; text-align:center; margin-top:20px; width:200px; height:200px; margin:auto;">
                <img src="../imagenes/cilindro.png" alt="Cilindro con radio y altura" width="200" height="200">
                <div id="valor-radio-cilindro" style="position:absolute; top:169px; left:106px; font-size:16px; color:red;">
                    r =
                </div>
                <div id="valor-altura-cilindro" style="position:absolute; top:100px; left:106px; font-size:16px; color:blue;">
                    h =
                </div>
            </div>

            <h2>🥤 Cilindro</h2>

            <div class="grupo-entrada">
                <label><i class="fas fa-ruler"></i> Radio:</label>
                <input
                    id="entrada-radio-cilindro"
                    placeholder="Ingrese el radio"
                    oninput="actualizarVisualCilindro()"
                >
            </div>

            <div class="grupo-entrada">
                <label><i class="fas fa-ruler"></i> Altura:</label>
                <input
                    id="entrada-altura-cilindro"
                    placeholder="Ingrese la altura"
                    oninput="actualizarVisualCilindro()"
                >
            </div>

            <div class="grupo-botones">
                <button class="boton boton-primario" onclick="calcularCilindro('area')">
                    <i class="fas fa-calculator"></i> Calcular Área Superficial
                </button>
                <button class="boton boton-primario" onclick="calcularCilindro('volumen')">
                    <i class="fas fa-ruler-combined"></i> Calcular Volumen
                </button>
                <button class="boton boton-secundario" onclick="mostrarPasosCilindro()">
                    <i class="fas fa-search"></i> Ver Pasos de resolución
                </button>
                <button class="boton boton-peligro" onclick="limpiarCilindro()">
                    <i class="fas fa-trash"></i> Limpiar
                </button>
            </div>

            <div id="resultado-cilindro" class="resultado">
                <i class="fas fa-info-circle"></i> Los resultados aparecerán aquí
            </div>

            <div id="pasos-cilindro" class="pasos-resolucion" style="display:none;"></div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script src="../figuras3d/cilindro.js"></script>
</body>
</html>
