<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Calculadora Geométrica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="light-mode">
    
    <main class="contenedor">
        
        <a href="../index.html" class="boton boton-regresar">
            <i class="fas fa-arrow-left"></i> Volver al Inicio
        </a>

        <h2><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</h2>

        <form id="loginForm">
            <div class="grupo-entrada">
                <label><i class="fas fa-envelope"></i> Correo Electrónico:</label>
                <input type="email" id="login-email" placeholder="usuario@ejemplo.com" required>
            </div>
            
            <div class="grupo-entrada">
                <label><i class="fas fa-lock"></i> Contraseña:</label>
                <input type="password" id="login-password" placeholder="Ingresa tu contraseña" required>
            </div>
            
            <button type="submit" class="boton boton-primario" style="width: 100%; margin: 20px 0;">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
            </button>
            
            <div class="enlace-alternativo" style="text-align: center; margin-top: 20px;">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </div>
        </form>

        <!-- Área para mostrar mensajes -->
        <div id="mensaje-login" style="margin-top: 20px;"></div>
    </main>

    <script src="../script.js"></script>
    
    <script>
        // Manejar el envío del formulario
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
        procesarLogin();
    });

    // Función para mostrar mensajes en el login (compatible con el nuevo sistema)
    function mostrarMensajeLogin(mensaje, tipo = 'error') {
        // Usar el nuevo sistema de mensajes flotantes
        mostrarMensaje(mensaje, tipo);
        
        // También mostrar en el área local por si acaso
        const mensajeDiv = document.getElementById('mensaje-login');
        if (mensajeDiv) {
            const color = tipo === 'error' ? 'red' : 'green';
            const background = tipo === 'error' ? '#ffeaea' : '#e8f5e8';
            const icon = tipo === 'error' ? 'exclamation-triangle' : 'check-circle';
            
            mensajeDiv.innerHTML = `
                <div style="color: ${color}; text-align: center; padding: 15px; border-radius: 10px; 
                            background: ${background}; border: 1px solid ${color}20; margin: 20px 0;">
                    <i class="fas fa-${icon}"></i> ${mensaje}
                </div>
            `;
        }
    }
    </script>
</body>
</html>
