<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Círculo - Calculadora Geométrica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="light-mode">
    <div class="contenedor">
        <div class="pantalla activa">
            <button class="boton boton-regresar" onclick="window.location.href='figuras2d.html'">
                <i class="fas fa-arrow-left"></i> Volver
            </button>

            <div id="contenedor-circulo" style="position: relative; text-align: center;">
                <img src="../imagenes/circulo.png" alt="Círculo con radio" width="300">
                <div id="valor-radio" style="position: absolute; top: 160px; left: 300px; font-size: 16px; color: red;">
                    radio = 
                </div>
            </div>

            <h2>⭕ Círculo</h2>

            <div class="grupo-entrada">
                <label><i class="fas fa-ruler"></i> Radio:</label>
                <input
                    id="entrada-radio-circulo"
                    placeholder="Ingrese el radio"
                    min="0"
                    step="0.01"
                    oninput="actualizarVisualCirculo()"
                >
            </div>

            <div class="grupo-botones">
                <button class="boton boton-primario" onclick="calcularCirculo2D('area')">
                    <i class="fas fa-calculator"></i> Calcular Área
                </button>
                <button class="boton boton-primario" onclick="calcularCirculo2D('perimetro')">
                    <i class="fas fa-ruler-combined"></i> Calcular Perímetro
                </button>
                <button class="boton boton-secundario" onclick="mostrarPasosCirculo()">
                    <i class="fas fa-search"></i> Ver Pasos de resolución
                </button>
                <button class="boton boton-peligro" onclick="limpiarCirculo()">
                    <i class="fas fa-trash"></i> Limpiar
                </button>
            </div>

            <div id="resultado-circulo-2d" class="resultado">
                <i class="fas fa-info-circle"></i> Los resultados aparecerán aquí
            </div>

            <div id="pasos-circulo" class="pasos-resolucion" style="display:none;"></div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script src="../figuras2d/circulo.js"></script>
</body>
</html>
