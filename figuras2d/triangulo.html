<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triángulo - Calculadora Geométrica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="light-mode">
    <div class="contenedor">
        <div class="pantalla activa">
            <button class="boton boton-regresar" onclick="window.location.href='figuras2d.html'">
                <i class="fas fa-arrow-left"></i> Volver
            </button>

            <!-- contenedor de la imagen (200x200) -->
            <div id="contenedor-triangulo" 
                style="position: relative; text-align:center; margin-top:20px; width:200px; height:200px; margin:auto;">
        
                <img src="../imagenes/triangulo.png" 
                    alt="Triángulo con base y altura" 
                    width="200" height="200">

                <!-- altura centrada -->
                <div id="valor-altura" 
                    style="position:absolute; top:50%; left:48%; transform:translate(-50%, -50%); font-size:14px; color:red;">
                    h =
                </div>

                <!-- base en la parte inferior -->
                <div id="valor-base" 
                    style="position:absolute; bottom:30px; left:48%; transform:translateX(-50%); font-size:14px; color:black;">
                    b =
                </div>
            </div>

            <h2>🔺 Triángulo</h2>

            <div class="grupo-entrada">
                <label><i class="fas fa-ruler"></i> Base (para área):</label>
                <input
                    id="entrada-base-triangulo"
                    placeholder="Ingrese la base"
                    min="0"
                    step="0.01"
                    oninput="actualizarVisualTriangulo()"
                >
            </div>

            <div class="grupo-entrada">
                <label><i class="fas fa-ruler"></i> Altura (para área):</label>
                <input
                    id="entrada-altura-triangulo"
                    placeholder="Ingrese la altura"
                    oninput="actualizarVisualTriangulo()"
                >
            </div>

            <div class="grupo-entrada">
                <label><i class="fas fa-ruler"></i> Lados (para perímetro):</label>
                <input
                    id="entrada-lado1-triangulo"
                    placeholder="Lado 1"
                >
                <input
                    id="entrada-lado2-triangulo"
                    placeholder="Lado 2"
                >
                <input
                    id="entrada-lado3-triangulo"
                    placeholder="Lado 3"
                >
            </div>

            <div class="grupo-botones">
                <button class="boton boton-primario" onclick="calcularTriangulo2D('area')">
                    <i class="fas fa-calculator"></i> Calcular Área
                </button>
                <button class="boton boton-primario" onclick="calcularTriangulo2D('perimetro')">
                    <i class="fas fa-ruler-combined"></i> Calcular Perímetro
                </button>
                <button class="boton boton-secundario" onclick="mostrarPasosTriangulo()">
                    <i class="fas fa-search"></i> Ver Pasos de resolución
                </button>
                <button class="boton boton-peligro" onclick="limpiarTriangulo()">
                    <i class="fas fa-trash"></i> Limpiar
                </button>
            </div>

            <div id="resultado-triangulo-2d" class="resultado">
                <i class="fas fa-info-circle"></i> Los resultados aparecerán aquí
            </div>

            <div id="pasos-triangulo" class="pasos-resolucion" style="display:none;"></div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script src="triangulo.js"></script>
</body>
</html>
