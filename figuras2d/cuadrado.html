<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadrado - Calculadora Geométrica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="light-mode">
    <div class="contenedor">
        <div class="pantalla activa">
            <button class="boton boton-regresar" onclick="window.location.href='figuras2d.html'">
                <i class="fas fa-arrow-left"></i> Volver
            </button>

            <div id="contenedor-cuadrado" style="text-align: center; margin-top:20px; width:200px; margin:auto;">
                <img src="../imagenes/cuadrado.png" alt="Cuadrado con lado marcado" width="200">
                <div id="valor-lado" style="font-size:16px; color:red; margin-top:5px;">
                    lado =
                </div>
            </div>

            <h2>⬜ Cuadrado</h2>

            <div class="grupo-entrada">
                <label><i class="fas fa-ruler"></i> Lado:</label>
                <input
                    id="entrada-lado-cuadrado"
                    placeholder="Ingrese el lado"
                    min="0"
                    step="0.01"
                    oninput="actualizarVisualCuadrado()"
                >
            </div>

            <div class="grupo-botones">
                <button class="boton boton-primario" onclick="calcularCuadrado2D('area')">
                    <i class="fas fa-calculator"></i> Calcular Área
                </button>
                <button class="boton boton-primario" onclick="calcularCuadrado2D('perimetro')">
                    <i class="fas fa-ruler-combined"></i> Calcular Perímetro
                </button>
                <button class="boton boton-secundario" onclick="mostrarPasosCuadrado()">
                    <i class="fas fa-search"></i> Ver Pasos de resolución
                </button>
                <button class="boton boton-peligro" onclick="limpiarCuadrado()">
                    <i class="fas fa-trash"></i> Limpiar
                </button>
            </div>

            <div id="resultado-cuadrado-2d" class="resultado">
                <i class="fas fa-info-circle"></i> Los resultados aparecerán aquí
            </div>

            <div id="pasos-cuadrado" class="pasos-resolucion" style="display:none;"></div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script src="../figuras2d/cuadrado.js"></script>
</body>
</html>
