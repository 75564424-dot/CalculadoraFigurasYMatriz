<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Geométrica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="light-mode">
    
    <div class="contenedor">
        <!-- Pantalla Principal -->
        <div id="pantalla-principal" class="pantalla activa">
            <!-- Encabezado con estado de usuario -->
            <div class="encabezado-usuario">
                <div id="estado-usuario" class="estado-usuario" style="display: none;">
                    <div class="info-usuario">
                        <i class="fas fa-user-circle"></i>
                        <span id="nombre-usuario"></span>
                    </div>
                    <button class="boton boton-peligro" onclick="cerrarSesion()">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </button>
                    <button class="boton boton-secundario" onclick="toggleHistorial()">
                        <i class="fas fa-history"></i> Mostrar/Ocultar Historial
                    </button>
                    <!-- 🔥 BOTÓN DE ADMINISTRACIÓN (SOLO PARA ADMIN) -->
                    <button id="boton-admin" class="boton boton-admin" onclick="window.location.href='administracion/CRUD.html'" style="display: none;">
                        <i class="fas fa-cogs"></i> Administración
                    </button>
                </div>
            </div>

            <h1><i class="fas fa-calculator"></i> Calculadora Geométrica</h1>

            <!-- Botón de modo oscuro (SIEMPRE VISIBLE) -->
            <div class="grupo-botones" style="justify-content: center; margin-bottom: 1.5rem;">
                <button class="boton" onclick="alternarModoOscuro()">
                    <i class="fas fa-moon"></i> Modo Oscuro
                </button>
            </div>

            <!-- Botones de autenticación (se ocultan cuando hay usuario logueado) -->
            <div id="botones-autenticacion" class="grupo-botones">
                <button class="boton boton-primario" onclick="window.location.href='autenticacion/login.html'">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
                <button class="boton boton-secundario" onclick="window.location.href='autenticacion/registro.html'">
                    <i class="fas fa-user-plus"></i> Registrarse
                </button>
            </div>

            <div class="tarjetas-opciones">
                <div class="tarjeta-opcion" onclick="window.location.href='figuras2d/figuras2d.html'">
                    <i class="fas fa-shapes"></i>
                    <h3>Figuras 2D</h3>
                    <p>Cálculo de áreas y perímetros</p>
                </div>
                
                <div class="tarjeta-opcion" onclick="window.location.href='figuras3d/figuras3d.html'">
                    <i class="fas fa-cube"></i>
                    <h3>Figuras 3D</h3>
                    <p>Cálculo de volúmenes y áreas</p>
                </div>
                
                <div class="tarjeta-opcion" onclick="window.location.href='matrices/matrices.html'">
                    <i class="fas fa-border-all"></i>
                    <h3>Matrices</h3>
                    <p>Cálculo de determinantes 4x4</p>
                </div>
            </div>
        </div>
    </div>
    <script src="usuario.js"></script>
    <script src="historial.js"></script>
    <script src="script.js"></script>
</body>
</html>
