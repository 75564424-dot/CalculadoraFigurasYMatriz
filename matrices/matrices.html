<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrices - Calculadora Geométrica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="light-mode">
    <div class="contenedor">
        <div class="pantalla activa">
            <button class="boton boton-regresar" onclick="window.location.href='../index.html'">
                <i class="fas fa-arrow-left"></i> Volver al Inicio
            </button>

            <h2><i class="fas fa-border-all"></i> Determinante de Matriz 4x4</h2>
            <p>Ingrese los 16 valores de la matriz:</p>

            <div class="contenedor-matriz-completa">
                <div class="cuadricula-matriz" id="contenedor-cuadricula-matriz"></div>
            </div>

            <div class="grupo-botones">
                <button class="boton boton-primario" onclick="calcularDeterminante()">
                    <i class="fas fa-calculator"></i> Calcular Determinante
                </button>
                <button class="boton boton-secundario" onclick="mostrarPasosResolucion()">
                    <i class="fas fa-search"></i> Ver Pasos de resolución
                </button>
                <button class="boton boton-peligro" onclick="limpiarEntradasMatriz()">
                    <i class="fas fa-trash"></i> Limpiar
                </button>
                <button class="boton boton-exito" onclick="imprimirResolucion()">
                    <i class="fas fa-print"></i> Imprimir
                </button>
            </div>

            <div id="resultado-matriz" class="resultado">
                <i class="fas fa-info-circle"></i> El determinante aparecerá aquí
            </div>

            <div id="pasos-resolucion" class="pasos-resolucion" style="display:none;"></div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script src="matrices.js"></script>
</body>
</html>
