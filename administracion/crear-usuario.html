<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

<!-- Contenedor principal para el formulario -->
<div class="contenedor">

    <!-- Título de la página -->
    <h2><i class="fas fa-user-plus"></i> Crear Nuevo Usuario</h2>

    <!-- Formulario de creación de usuario -->
    <div class="formulario">
        <div class="grupo-entrada">
            <label for="nombre"><i class="fas fa-user"></i> Nombre Completo</label>
            <input type="text" id="nombre" placeholder="Ingresa el nombre completo">
        </div>

        <div class="grupo-entrada">
            <label for="email"><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="email" placeholder="Ingresa el email">
        </div>

        <div class="grupo-entrada">
            <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa la contraseña">
        </div>

        <div class="grupo-entrada">
            <label><i class="fas fa-palette"></i> Tema Preferido</label>
            <div style="display: flex; gap: 15px; margin-top: 10px;">
                <label><input type="radio" name="tema" value="claro" checked> Modo Claro</label>
                <label><input type="radio" name="tema" value="oscuro"> Modo Oscuro</label>
            </div>
        </div>

        <div class="grupo-entrada">
            <label for="rol"><i class="fas fa-user-shield"></i> Rol</label>
            <select id="rol">
                <option value="usuario">Usuario</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <!-- Botones de acción -->
        <div class="grupo-botones">
            <button class="boton boton-primario" onclick="crearUsuario()">
                <i class="fas fa-save"></i> Guardar Usuario
            </button>
            <button class="boton boton-regresar" onclick="window.location.href='CRUD.html'">
                <i class="fas fa-times"></i> Cancelar
            </button>
        </div>
    </div>
</div>

<!-- Incluimos el archivo JavaScript que maneja la lógica -->
<script src="crear.js"></script>
<script src="../script.js"></script>
</body>
</html>
