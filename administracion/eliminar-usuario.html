<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Usuario</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="contenedor">
    <h2><i class="fas fa-trash-alt"></i> Eliminar Usuario</h2>

    <div class="formulario">

        <div class="grupo-entrada">
            <label for="email"><i class="fas fa-envelope"></i> Email del Usuario</label>
            <input type="email" id="email" placeholder="Ingresa el email del usuario">
        </div>

        <div class="grupo-botones">
            <button class="boton boton-primario" onclick="eliminarUsuario()">
                <i class="fas fa-trash"></i> Eliminar
            </button>

            <button class="boton boton-regresar" onclick="window.location.href='CRUD.html'">
                <i class="fas fa-arrow-left"></i> Regresar
            </button>
        </div>

    </div>
</div>

<script src="eliminar.js"></script>
<script src="../script.js"></script>
</body>
</html>
