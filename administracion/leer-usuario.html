<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leer Usuarios</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="contenedor">
    <h2><i class="fas fa-users"></i> Lista de Usuarios</h2>

    <div class="formulario">

        <!-- Buscador -->
        <div class="grupo-entrada">
            <label for="email"><i class="fas fa-envelope"></i> Buscar por Email</label>
            <input type="email" id="email" placeholder="Ingresa el email del usuario">
        </div>

        <div class="grupo-botones">
            <button class="boton boton-primario" onclick="buscarUsuario()">
                <i class="fas fa-search"></i> Buscar
            </button>
            <button class="boton boton-regresar" onclick="window.location.href='CRUD.html'">
                <i class="fas fa-arrow-left"></i> Regresar
            </button>
        </div>

        <div id="mensaje" class="resultado" style="display:none"></div>

        <!-- TABLA CON CUADRÍCULA -->
        <div style="margin-top:25px; overflow-x:auto;">
            <table id="tablaUsuarios" class="tabla-crud" style="display:none; width:100%; border-collapse:collapse;">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Tema Preferido</th>
                        <th>Rol</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla"></tbody>
            </table>
        </div>

    </div>
</div>

<script src="leer.js"></script>
<script src="../script.js"></script>
</body>
</html>
