<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Usuario</title>

    <!-- Íconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="contenedor">
    <h2><i class="fas fa-edit"></i> Actualizar Usuario</h2>

    <div class="formulario">

        <!-- Buscar usuario -->
        <div class="grupo-entrada">
            <label for="emailBuscar"><i class="fas fa-envelope"></i> Email a Buscar</label>
            <input type="email" id="emailBuscar" placeholder="Ingresa el email del usuario">
        </div>

        <button class="boton boton-primario" onclick="cargarUsuarioParaEditar()">
            <i class="fas fa-search"></i> Cargar Datos
        </button>

        <hr style="margin: 25px 0;">

        <!-- Campos cargados -->
        <div class="grupo-entrada">
            <label for="nombre"><i class="fas fa-user"></i> Nombre</label>
            <input type="text" id="nombre" disabled placeholder="Nombre cargado">
        </div>

        <div class="grupo-entrada">
            <label for="email"><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="email" disabled placeholder="Email cargado">
        </div>

        <div class="grupo-entrada">
            <label><i class="fas fa-palette"></i> Tema Preferido</label>
            <div style="display: flex; gap: 15px; margin-top: 10px;">
                <label><input type="radio" name="tema" value="claro"> Modo Claro</label>
                <label><input type="radio" name="tema" value="oscuro"> Modo Oscuro</label>
            </div>
        </div>

        <div class="grupo-entrada">
            <label for="rol"><i class="fas fa-user-shield"></i> Rol</label>
            <select id="rol">
                <option value="usuario">Usuario</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <div class="grupo-botones">
            <button class="boton boton-primario" onclick="actualizarUsuario()">
                <i class="fas fa-save"></i> Actualizar
            </button>

            <button class="boton boton-regresar" onclick="window.location.href='CRUD.html'">
                <i class="fas fa-times"></i> Cancelar
            </button>
        </div>
    </div>

</div>

<script src="actualizar.js"></script>
<script src="../script.js"></script>
</body>
</html>
